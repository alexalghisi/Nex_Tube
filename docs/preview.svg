<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Nex Tube after install: home shelf, watch pane, and mini player with audio still running">
  <defs>
    <style>
      .bar { transform-box: fill-box; transform-origin: center bottom; }
      .b1 { animation: eq 0.7s ease-in-out infinite; }
      .b2 { animation: eq 0.7s ease-in-out 0.12s infinite; }
      .b3 { animation: eq 0.7s ease-in-out 0.24s infinite; }
      .b4 { animation: eq 0.7s ease-in-out 0.08s infinite; }
      .pulse { animation: glow 1.6s ease-in-out infinite; }
      .slide { animation: in 0.7s ease both; }
      @keyframes eq {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1); }
      }
      @keyframes glow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes in {
        from { transform: translateY(8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
    </style>
  </defs>
  <rect width="960" height="620" rx="18" fill="#0f0f0f"/>
  <rect x="0" y="0" width="960" height="56" fill="#0f0f0f"/>
  <rect x="20" y="18" width="28" height="20" rx="4" fill="#ff0000"/>
  <polygon points="29,22 41,28 29,34" fill="#f1f1f1"/>
  <text x="56" y="35" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Nex Tube</text>
  <rect x="820" y="16" width="120" height="24" rx="12" fill="none" stroke="#3ea6ff"/>
  <text x="880" y="33" text-anchor="middle" fill="#3ea6ff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Sign in</text>
  <rect x="0" y="56" width="960" height="1" fill="#3f3f3f"/>

  <g class="slide">
    <rect x="20" y="72" width="46" height="24" rx="12" fill="#f1f1f1"/>
    <text x="43" y="88" text-anchor="middle" fill="#0f0f0f" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">All</text>
    <rect x="74" y="72" width="52" height="24" rx="12" fill="#272727"/>
    <text x="100" y="88" text-anchor="middle" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">Film</text>
    <rect x="134" y="72" width="58" height="24" rx="12" fill="#272727"/>
    <text x="163" y="88" text-anchor="middle" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">Music</text>
    <rect x="200" y="72" width="68" height="24" rx="12" fill="#272727"/>
    <text x="234" y="88" text-anchor="middle" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">Gaming</text>
  </g>

  <g class="slide">
    <rect x="20" y="112" width="300" height="168" rx="4" fill="#1a3a22"/>
    <rect x="20" y="112" width="300" height="168" rx="4" fill="#2d6a3e" opacity="0.35"/>
    <polygon points="156,178 186,196 156,214" fill="#f1f1f1"/>
    <rect x="268" y="256" width="42" height="16" rx="2" fill="#000" opacity="0.8"/>
    <text x="289" y="268" text-anchor="middle" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">9:56</text>
    <text x="20" y="304" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Big Buck Bunny</text>
    <text x="20" y="322" fill="#aaaaaa" font-family="Arial, Helvetica, sans-serif" font-size="11">Blender Foundation · 18.4M views</text>

    <rect x="336" y="112" width="300" height="168" rx="4" fill="#3a2a12"/>
    <rect x="448" y="178" width="76" height="44" rx="4" fill="#c9a227"/>
    <text x="336" y="304" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Sintel</text>
    <text x="336" y="322" fill="#aaaaaa" font-family="Arial, Helvetica, sans-serif" font-size="11">Blender Foundation · 15.3M views</text>

    <rect x="652" y="112" width="288" height="168" rx="4" fill="#1a2438"/>
    <circle cx="796" cy="196" r="28" fill="#4a6fa5"/>
    <text x="652" y="304" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Elephants Dream</text>
    <text x="652" y="322" fill="#aaaaaa" font-family="Arial, Helvetica, sans-serif" font-size="11">Blender Foundation · 9.2M views</text>
  </g>

  <rect x="0" y="500" width="960" height="64" fill="#212121"/>
  <rect x="0" y="500" width="114" height="64" fill="#000"/>
  <polygon points="48,522 78,532 48,542" fill="#f1f1f1"/>
  <text x="128" y="526" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Big Buck Bunny</text>
  <text x="128" y="546" fill="#aaaaaa" font-family="Arial, Helvetica, sans-serif" font-size="11">Playing with the watch screen closed</text>
  <g transform="translate(820 516)">
    <rect class="bar b1" x="0" y="8" width="6" height="24" rx="1" fill="#ff0000"/>
    <rect class="bar b2" x="10" y="4" width="6" height="28" rx="1" fill="#ff0000"/>
    <rect class="bar b3" x="20" y="10" width="6" height="22" rx="1" fill="#ff0000"/>
    <rect class="bar b4" x="30" y="2" width="6" height="30" rx="1" fill="#ff0000"/>
  </g>
  <circle class="pulse" cx="900" cy="532" r="5" fill="#ff0000"/>

  <rect x="0" y="564" width="960" height="56" fill="#0f0f0f"/>
  <text x="160" y="598" text-anchor="middle" fill="#f1f1f1" font-family="Arial, Helvetica, sans-serif" font-size="11">Home</text>
  <text x="480" y="598" text-anchor="middle" fill="#aaaaaa" font-family="Arial, Helvetica, sans-serif" font-size="11">Search</text>
  <text x="800" y="598" text-anchor="middle" fill="#aaaaaa" font-family="Arial, Helvetica, sans-serif" font-size="11">Library</text>
</svg>
