name: release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    android:
        name: Build Android APK
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
            - uses: android-actions/setup-android@v4
            - run: npm ci
            - run: npx expo prebuild --platform android --no-install
            - working-directory: android
              run: ./gradlew assembleRelease --no-daemon
            - uses: actions/upload-artifact@v4
              with:
                  name: nex-android
                  path: android/app/build/outputs/apk/release/*.apk
                  if-no-files-found: error

    ios:
        name: Build iOS IPA
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx expo prebuild --platform ios --no-install
            - working-directory: ios
              run: pod install
            - name: Build unsigned archive
              working-directory: ios
              run: |
                  SCHEME=$(basename ./*.xcworkspace .xcworkspace)
                  xcodebuild archive \
                    -workspace "$SCHEME.xcworkspace" \
                    -scheme "$SCHEME" \
                    -configuration Release \
                    -destination 'generic/platform=iOS' \
                    -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
                    CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            - name: Package unsigned IPA
              run: |
                  APP=$(ls -d "$RUNNER_TEMP"/*.xcarchive/Products/Applications/*.app | head -1)
                  mkdir -p "$RUNNER_TEMP/Payload"
                  cp -R "$APP" "$RUNNER_TEMP/Payload/"
                  (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/NexTube-unsigned.ipa" Payload)
            - uses: actions/upload-artifact@v4
              with:
                  name: nex-ios
                  path: NexTube-unsigned.ipa
                  if-no-files-found: error

    macos:
        name: Build macOS DMG
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run export:web
            - run: npm run desktop:web
            - working-directory: desktop
              run: npm ci
            - working-directory: desktop
              run: npm run dist:mac
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: false
            - uses: actions/upload-artifact@v4
              with:
                  name: nex-macos
                  path: desktop/dist/*.dmg
                  if-no-files-found: error

    publish:
        name: Publish GitHub Release
        needs: [android, ios, macos]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
            - uses: softprops/action-gh-release@v2
              with:
                  files: |
                      artifacts/nex-android/*.apk
                      artifacts/nex-ios/*.ipa
                      artifacts/nex-macos/*.dmg
